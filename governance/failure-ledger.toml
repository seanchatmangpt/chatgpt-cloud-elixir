# Academy Module 8, Failure as Permanent Learning:
#   failure -> classification -> failed transition -> new hypothesis -> narrow repair -> permanent guard -> rerun
# Every entry names guards (ids in agi-academy-conformance.toml) that execute in
# scripts/verify-agi-conformance.py. An entry whose guard fails makes the ledger PARTIAL_ALIVE.
schema = "chatgpt-cloud.failure-ledger.v1"

[[failure]]
id = "lfs-budget-exhausted-2026-09-24"
observed = "CI `manufacture` exit 128: ggen-marketplace@420bc91e smudge failed, 'This repository exceeded its LFS budget'"
failed_transition = "source-closure fetch"
classification = "external quota dependency, plus duplicated fetch logic that drifted (local replay skipped LFS, the workflow did not)"
repair = "one canonical fetcher; cc:lfsObjectPolicy pointer-identity law; staged-pointer build falsifier; committed parts never LFS"
guards = ["court-tests", "rail-guard-tests", "transport-tests"]
refs = ["scripts/fetch-capability-sources.sh", "manufacturing/ontology.ttl"]

