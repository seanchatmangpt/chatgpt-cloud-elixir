name: WS3 Canonical Format

on:
  push:
    branches:
      - chatgpt-ws3-runtime-20260827-1125

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chatgpt-ws3-runtime-20260827-1125
          fetch-depth: 0

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: "29.0"
          elixir-version: "1.20.2"

      - name: Resolve canonical formatter closure
        working-directory: control-plane
        run: |
          set -euo pipefail
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Canonical format
        working-directory: control-plane
        run: mix format

      - name: Commit formatter projection when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- control-plane; then
            echo "FORMAT_ALREADY_CANONICAL=true"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add control-plane
          git commit -m "chore(runtime): apply canonical Elixir formatter"
          git push origin HEAD:chatgpt-ws3-runtime-20260827-1125
