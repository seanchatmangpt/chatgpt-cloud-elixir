name: Vision 2030 Canonical Format Repair

on:
  push:
    branches: ["feature/project-two-semantic-virtualization-20260825"]
    paths:
      - ".github/workflows/vision2030-format-repair.yml"

permissions:
  contents: write

concurrency:
  group: vision2030-format-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/project-two-semantic-virtualization-20260825
          fetch-depth: 0

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: "29.0"
          elixir-version: "1.20.2"

      - name: Resolve formatter and compiler closure
        working-directory: control-plane
        env:
          MIX_ENV: test
        run: |
          set -euo pipefail
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix format
          mix format --check-formatted
          mix compile --warnings-as-errors

      - name: Commit canonical formatting and remove one-shot court
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/vision2030-format-repair.yml
          git config user.name "chatgpt-ci-repair[bot]"
          git config user.email "chatgpt-ci-repair[bot]@users.noreply.github.com"
          git add control-plane .github/workflows/vision2030-format-repair.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: canonicalize Vision 2030 Ash projection"
          for attempt in 1 2 3 4 5; do
            git fetch origin feature/project-two-semantic-virtualization-20260825
            if ! git rebase origin/feature/project-two-semantic-virtualization-20260825; then
              git rebase --abort || true
              echo "REFUSED[FORMAT_REBASE_CONFLICT]" >&2
              exit 2
            fi
            if git push origin HEAD:feature/project-two-semantic-virtualization-20260825; then
              exit 0
            fi
            sleep "$attempt"
          done
          echo "REFUSED[FORMAT_PUSH_CONTENTION]" >&2
          exit 3
