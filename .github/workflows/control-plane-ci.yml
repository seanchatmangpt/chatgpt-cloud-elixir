name: Control Plane CI

on:
  pull_request:
    paths:
      - "control-plane/**"
      - "scripts/emit-ocel.py"
      - ".github/workflows/control-plane-ci.yml"
      - ".github/workflows/deploy-fly.yml"
  push:
    branches: [main, "feat/**"]
    paths:
      - "control-plane/**"
      - "scripts/emit-ocel.py"
      - ".github/workflows/control-plane-ci.yml"
      - ".github/workflows/deploy-fly.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chatgpt_cloud_control_plane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chatgpt_cloud_control_plane_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    env:
      MIX_ENV: test
      DATABASE_URL: ecto://postgres:postgres@localhost:5432/chatgpt_cloud_control_plane_test
      OCEL_INGEST_TOKEN: test-token

    defaults:
      run:
        working-directory: control-plane

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: "29.0"
          elixir-version: "1.20.2"

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Resolve dependency closure
        run: mix deps.get

      - name: Format
        run: mix format --check-formatted

      - name: Strict compile
        run: mix compile --warnings-as-errors

      - name: Migrate test database
        run: |
          mix ecto.create --quiet
          mix ecto.migrate

      - name: Test ingestion, Ash resources, API and LiveView
        run: mix test

      - name: Verify generic OCEL producer
        working-directory: .
        run: |
          python3 scripts/emit-ocel.py \
            --activity ci.producer.self_test \
            --standing ALIVE \
            --authority-domain OBSERVE \
            --agent-id github-actions:self-test \
            --run-id "$GITHUB_RUN_ID" \
            --sequence 1 \
            --repo "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA" \
            | python3 -m json.tool >/dev/null

      - name: Build production assets and release
        env:
          MIX_ENV: prod
        run: |
          mix assets.deploy
          mix release

      - name: Build Fly Docker image
        working-directory: control-plane
        run: docker build --pull --tag chatgpt-cloud-control-plane:${GITHUB_SHA} .

      - name: Upload resolved lockfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: chatgpt-cloud-control-plane-lock-${{ github.event.pull_request.head.sha || github.sha }}
          path: control-plane/mix.lock
          if-no-files-found: error
          retention-days: 2
