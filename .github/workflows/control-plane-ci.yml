name: Control Plane CI

on:
  pull_request:
    paths:
      - "control-plane/**"
      - "scripts/emit-ocel.py"
      - "scripts/project_memory_proxy.py"
      - "scripts/project_memory_bus.py"
      - "scripts/project_memory_semantic_proxy.py"
      - "scripts/project_semantic_projection.py"
      - "scripts/project_vision_2030.py"
      - "tests/test_project_memory_proxy.py"
      - "tests/test_project_memory_bus.py"
      - "tests/test_project_semantic_projection.py"
      - "tests/test_project_vision_2030.py"
      - ".github/workflows/control-plane-ci.yml"
      - ".github/workflows/project-memory-proxy.yml"
      - ".github/workflows/deploy-fly.yml"
  push:
    branches: [main, "feat/**", "feature/**"]
    paths:
      - "control-plane/**"
      - "scripts/emit-ocel.py"
      - "scripts/project_memory_proxy.py"
      - "scripts/project_memory_bus.py"
      - "scripts/project_memory_semantic_proxy.py"
      - "scripts/project_semantic_projection.py"
      - "scripts/project_vision_2030.py"
      - "tests/test_project_memory_proxy.py"
      - "tests/test_project_memory_bus.py"
      - "tests/test_project_semantic_projection.py"
      - "tests/test_project_vision_2030.py"
      - ".github/workflows/control-plane-ci.yml"
      - ".github/workflows/project-memory-proxy.yml"
      - ".github/workflows/deploy-fly.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chatgpt_cloud_control_plane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chatgpt_cloud_control_plane_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    env:
      MIX_ENV: test
      DATABASE_URL: ecto://postgres:postgres@localhost:5432/chatgpt_cloud_control_plane_test
      OCEL_INGEST_TOKEN: test-token

    defaults:
      run:
        working-directory: control-plane

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Qualify Project memory and Vision 2030 deterministic parity
        working-directory: .
        run: >-
          python3 -m unittest
          tests/test_project_memory_proxy.py
          tests/test_project_memory_bus.py
          tests/test_project_semantic_projection.py
          tests/test_project_vision_2030.py

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: "29.0"
          elixir-version: "1.20.2"

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Resolve dependency closure
        run: mix deps.get

      - name: Format
        run: mix format --check-formatted

      - name: Strict compile
        run: mix compile --warnings-as-errors

      - name: Migrate test database
        run: |
          mix ecto.create --quiet
          mix ecto.migrate

      - name: Verify compiled Ash ecosystem closure
        run: |
          mkdir -p tmp
          mix chatgpt_cloud.ecosystem.verify | tee tmp/ash-ecosystem-receipt.json

      - name: Test ingestion, Ash resources, APIs and LiveView
        run: mix test

      - name: Verify generic OCEL producer
        working-directory: .
        run: |
          python3 scripts/emit-ocel.py \
            --activity ci.producer.self_test \
            --standing ALIVE \
            --authority-domain OBSERVE \
            --agent-id github-actions:self-test \
            --run-id "$GITHUB_RUN_ID" \
            --sequence 1 \
            --repo "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA" \
            | python3 -m json.tool >/dev/null

      - name: Build production assets and release
        env:
          MIX_ENV: prod
          DATABASE_URL: ecto://postgres:postgres@localhost:5432/chatgpt_cloud_control_plane_test
          SECRET_KEY_BASE: 6q6tmJgRZ1m3n5P7v9X2a4c6e8g0i2k4m6o8q0s2u4w6y8A0C2E4G6I8K0M2O4Q6
          OCEL_INGEST_TOKEN: release-test-token
          ADMIN_USERNAME: release
          ADMIN_PASSWORD: release-test-password
          CLOAK_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
        run: |
          mix assets.deploy
          mix release

      - name: Build Fly Docker image
        working-directory: control-plane
        run: docker build --pull --tag chatgpt-cloud-control-plane:${GITHUB_SHA} .

      - name: Upload exact dependency and ecosystem receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: chatgpt-cloud-control-plane-closure-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            control-plane/mix.lock
            control-plane/tmp/ash-ecosystem-receipt.json
          if-no-files-found: error
          retention-days: 14
