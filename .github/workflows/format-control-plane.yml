name: Format Control Plane

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/format-control-plane.yml"
      - "control-plane/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact subject
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected" || {
            printf 'REFUSED_INEXACT_FORMAT_SUBJECT expected=%s actual=%s\n' "$expected" "$actual" >&2
            exit 70
          }
          printf 'FORMAT_SUBJECT=%s\n' "$actual"

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: "29.0"
          elixir-version: "1.20.2"

      - name: Resolve exact formatter dependency closure
        working-directory: control-plane
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Verify canonical formatter without mutation
        working-directory: control-plane
        run: |
          set -euo pipefail
          mix format --check-formatted

      - name: Refuse formatter-induced source mutation
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- control-plane; then
            echo "REFUSED_FORMATTER_MUTATION" >&2
            git diff --check -- control-plane
            git diff -- control-plane
            exit 70
          fi
          echo "FORMAT_CONTROL_PLANE=ALIVE authority=VERIFY actuation_performed=false"
