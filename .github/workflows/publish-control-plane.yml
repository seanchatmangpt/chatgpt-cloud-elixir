name: Publish Control Plane Source

on:
  push:
    branches: [feat/process-intelligence-capsule]
    paths:
      - .github/workflows/publish-control-plane.yml
      - .bootstrap/**

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/process-intelligence-capsule
          fetch-depth: 0

      - name: Materialize validated source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/control-plane.b64.part{1,2,3,4,5} | base64 --decode > "${RUNNER_TEMP}/control-plane.tgz"
          tar -xzf "${RUNNER_TEMP}/control-plane.tgz" -C .
          chmod +x scripts/emit-ocel.py control-plane/scripts/bootstrap-fly.sh

      - name: Remove bootstrap-only material
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-control-plane.yml
          rm -f .github/workflows/publish-control-plane.yml

      - name: Commit ordinary source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "chatgpt-cloud-elixir manufacturing"
          git config user.email "136349053+seanchatmangpt@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(control-plane): add Fly OCEL intelligence dashboard"
          git push origin HEAD:feat/process-intelligence-capsule
