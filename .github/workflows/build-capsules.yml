name: Build Capsules

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [beam-core, ash-core, ash-postgres, ash-phoenix, ash-full]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.0"
          elixir-version: "1.20.2"

      - name: Manufacture capsule
        shell: bash
        run: |
          chmod +x scripts/*.sh
          scripts/build-capsule.sh "${{ matrix.variant }}"

      - name: Verify fresh extracted consumer
        shell: bash
        run: |
          set -euo pipefail
          archive="$(ls dist/chatgpt-cloud-elixir-${{ matrix.variant }}-*.tar.gz)"
          expected="$(awk '{print $1}' "$archive.sha256")"
          actual="$(sha256sum "$archive" | awk '{print $1}')"
          test "$expected" = "$actual"
          rm -rf consumer
          mkdir consumer
          tar -xzf "$archive" -C consumer
          CAPSULE_ARCHIVE_DIGEST="$actual" bash consumer/scripts/run-offline.sh
          cp consumer/receipt.json "dist/${{ matrix.variant }}-consumer-receipt.json"

      - name: Upload capsule
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: chatgpt-cloud-elixir-${{ matrix.variant }}-otp29-elixir1.20.2-linux-x86_64
          path: |
            dist/chatgpt-cloud-elixir-${{ matrix.variant }}-*.tar.gz
            dist/chatgpt-cloud-elixir-${{ matrix.variant }}-*.tar.gz.sha256
            dist/${{ matrix.variant }}-consumer-receipt.json
          if-no-files-found: error
          retention-days: 14
