name: Project v2 Memory Proxy

on:
  push:
    paths:
      - ".github/workflows/project-memory-proxy.yml"
      - "scripts/project_memory_proxy.py"
      - "tests/test_project_memory_proxy.py"
      - "project-memory/requests/**/*.json"
  workflow_dispatch:
    inputs:
      request_path:
        description: "Optional project-memory/requests/*.json request to execute"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: project-memory-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  proxy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PROJECT_MEMORY_OWNER: seanchatmangpt
      PROJECT_MEMORY_NUMBER: "2"
      PROJECTS_TOKEN_PRIMARY: ${{ secrets.PROJECTS_TOKEN }}
      PROJECTS_TOKEN_GH_TOKEN: ${{ secrets.GH_TOKEN }}
      PROJECTS_TOKEN_GH_PAT: ${{ secrets.GH_PAT }}
      PROJECTS_TOKEN_GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
      GITHUB_TOKEN_FALLBACK: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate proxy implementation
        run: python -m unittest tests/test_project_memory_proxy.py

      - name: Resolve request set
        id: requests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .project-memory-runtime project-memory/receipts
          : > .project-memory-runtime/requests.txt
          dispatch_path="${{ inputs.request_path || '' }}"
          if [[ -n "$dispatch_path" ]]; then
            case "$dispatch_path" in
              project-memory/requests/*.json|project-memory/requests/**/*.json)
                test -f "$dispatch_path"
                printf '%s\n' "$dispatch_path" >> .project-memory-runtime/requests.txt
                ;;
              *) exit 2 ;;
            esac
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            before="${{ github.event.before }}"
            after="${{ github.sha }}"
            if [[ "$before" =~ ^0+$ ]]; then
              git diff-tree --no-commit-id --name-only -r "$after" -- project-memory/requests/ | grep -E '\.json$' >> .project-memory-runtime/requests.txt || true
            else
              git diff --name-only --diff-filter=AM "$before" "$after" -- project-memory/requests/ | grep -E '\.json$' >> .project-memory-runtime/requests.txt || true
            fi
          fi
          sort -u -o .project-memory-runtime/requests.txt .project-memory-runtime/requests.txt
          count="$(grep -c . .project-memory-runtime/requests.txt || true)"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Execute bounded Project v2 requests
        if: steps.requests.outputs.count != '0'
        shell: bash
        run: |
          set -uo pipefail
          if [[ -n "${PROJECTS_TOKEN_PRIMARY:-}" ]]; then export PROJECTS_TOKEN="$PROJECTS_TOKEN_PRIMARY"; export PROJECTS_TOKEN_SOURCE="PROJECTS_TOKEN secret";
          elif [[ -n "${PROJECTS_TOKEN_GH_TOKEN:-}" ]]; then export PROJECTS_TOKEN="$PROJECTS_TOKEN_GH_TOKEN"; export PROJECTS_TOKEN_SOURCE="GH_TOKEN secret";
          elif [[ -n "${PROJECTS_TOKEN_GH_PAT:-}" ]]; then export PROJECTS_TOKEN="$PROJECTS_TOKEN_GH_PAT"; export PROJECTS_TOKEN_SOURCE="GH_PAT secret";
          elif [[ -n "${PROJECTS_TOKEN_GITHUB_PAT:-}" ]]; then export PROJECTS_TOKEN="$PROJECTS_TOKEN_GITHUB_PAT"; export PROJECTS_TOKEN_SOURCE="GITHUB_PAT secret";
          else export PROJECTS_TOKEN="$GITHUB_TOKEN_FALLBACK"; export PROJECTS_TOKEN_SOURCE="repository GITHUB_TOKEN fallback"; fi
          failures=0
          while IFS= read -r request; do
            [[ -n "$request" ]] || continue
            base="$(basename "$request" .json)"
            receipt="project-memory/receipts/${base}.receipt.json"
            python scripts/project_memory_proxy.py --request "$request" --receipt "$receipt" || failures=$((failures + 1))
          done < .project-memory-runtime/requests.txt
          printf '%s\n' "$failures" > .project-memory-runtime/failures.txt

      - name: Commit receipts to transport branch
        if: always() && steps.requests.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "chatgpt-project-memory[bot]"
          git config user.email "chatgpt-project-memory[bot]@users.noreply.github.com"
          git add project-memory/receipts/
          git diff --cached --quiet && exit 0
          git commit -m "receipt: Project v2 memory proxy"
          for attempt in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              echo "REFUSED[RECEIPT_REBASE_CONFLICT]" >&2
              exit 2
            fi
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep "$attempt"
          done
          echo "REFUSED[RECEIPT_PUSH_CONTENTION]" >&2
          exit 3

      - name: Upload receipts
        if: always() && steps.requests.outputs.count != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: project-memory-receipts-${{ github.run_id }}
          path: |
            project-memory/receipts/*.receipt.json
            .project-memory-runtime/requests.txt
            .project-memory-runtime/failures.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce receipt standing
        if: always() && steps.requests.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          failures="$(cat .project-memory-runtime/failures.txt 2>/dev/null || echo 0)"
          test "$failures" = "0"
