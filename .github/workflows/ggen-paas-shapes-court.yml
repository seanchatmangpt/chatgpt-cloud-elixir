name: GGen PaaS Shapes Court

# ggen/paas/ + ggen/capability-lineage/ (138 RDF/SPARQL files) are entirely
# orphaned per docs/errc-tracker.md (ELIMINATE): no script, workflow, or doc
# anywhere references any filename or predicate from either tree. This court
# does not wire them into a functional runtime-admission pipeline -- it only
# proves they are real and well-formed (Turtle parses, the runtime-admission
# subtree really is SHACL and nothing else is, the SHACL shapes are
# well-formed, the SPARQL guard queries are syntactically valid), so "nothing
# references them" becomes "CI validates them" even though nothing yet
# executes them functionally.

on:
  pull_request:
    paths:
      - "ggen/paas/**"
      - "ggen/capability-lineage/**"
      - "scripts/verify-ggen-paas-shapes.py"
      - ".github/workflows/ggen-paas-shapes-court.yml"
  push:
    branches:
      - main
    paths:
      - "ggen/paas/**"
      - "ggen/capability-lineage/**"
      - "scripts/verify-ggen-paas-shapes.py"
      - ".github/workflows/ggen-paas-shapes-court.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ggen-paas-shapes-court-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  shapes-court:
    name: Turtle parse + SHACL well-formedness + SPARQL parse
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install rdflib + pyshacl
        run: pip3 install rdflib pyshacl

      - name: Compile validator
        run: python3 -m py_compile scripts/verify-ggen-paas-shapes.py

      - name: Validate ggen/paas/ + ggen/capability-lineage/
        run: python3 scripts/verify-ggen-paas-shapes.py
