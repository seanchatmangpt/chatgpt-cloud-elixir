name: One-shot Project Two Semantic Formatter Repair

on:
  push:
    branches:
      - feature/project-two-semantic-virtualization-20260825
    paths:
      - ".github/workflows/semantic-format-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Assert admitted repair subject
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "${GITHUB_REF_NAME}" = "feature/project-two-semantic-virtualization-20260825"

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: "29.0"
          elixir-version: "1.20.2"

      - name: Resolve canonical formatter closure
        working-directory: control-plane
        run: |
          set -euo pipefail
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Apply canonical formatter
        working-directory: control-plane
        run: |
          set -euo pipefail
          mix format \
            lib/chatgpt_cloud_control_plane/dfcm_memory/domain.ex \
            lib/chatgpt_cloud_control_plane/dfcm_memory/memory_record.ex \
            lib/chatgpt_cloud_control_plane/dfcm_memory/semantic_actions.ex \
            lib/chatgpt_cloud_control_plane/dfcm_memory/virtual_project.ex \
            test/chatgpt_cloud/dfcm_memory/virtual_project_test.exs
          mix format --check-formatted

      - name: Manufacture formatter repair commit and self-delete
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/semantic-format-repair.yml
          git config user.name "chatgpt-semantic-repair[bot]"
          git config user.email "chatgpt-semantic-repair[bot]@users.noreply.github.com"
          git add \
            .github/workflows/semantic-format-repair.yml \
            control-plane/lib/chatgpt_cloud_control_plane/dfcm_memory/domain.ex \
            control-plane/lib/chatgpt_cloud_control_plane/dfcm_memory/memory_record.ex \
            control-plane/lib/chatgpt_cloud_control_plane/dfcm_memory/semantic_actions.ex \
            control-plane/lib/chatgpt_cloud_control_plane/dfcm_memory/virtual_project.ex \
            control-plane/test/chatgpt_cloud/dfcm_memory/virtual_project_test.exs
          if git diff --cached --quiet; then
            echo "BUILD_BROKEN[FORMAT_REPAIR_NO_DIFF]" >&2
            exit 70
          fi
          git diff --cached --check
          git commit -m "project-memory: apply canonical Elixir formatting"
          git push origin "HEAD:${GITHUB_REF_NAME}"
