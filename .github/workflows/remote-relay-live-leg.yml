name: Remote Relay Live-Leg Court

on:
  pull_request:
    paths:
      - "contracts/xaas-remote-relay.contract.json"
      - "scripts/xaas-relay.py"
      - "scripts/remote-relay-court.py"
      - "tests/test_xaas_relay.py"
      - ".github/workflows/remote-relay-live-leg.yml"
  push:
    branches:
      - "feat/v26.9.25-relay-client"
    paths:
      - "contracts/xaas-remote-relay.contract.json"
      - "scripts/xaas-relay.py"
      - "scripts/remote-relay-court.py"
      - "tests/test_xaas_relay.py"
      - ".github/workflows/remote-relay-live-leg.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-leg:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout cloud relay subject
        uses: actions/checkout@v4
        with:
          path: cloud
          persist-credentials: false

      - name: Checkout XaaS relay subject
        uses: actions/checkout@v4
        with:
          repository: seanchatmangpt/xaas
          ref: 9820fe3bfe2cf0fecd2b13b598681cd1ec3b094f
          path: xaas
          persist-credentials: false

      - name: Checkout zcode gall-work subject
        uses: actions/checkout@v4
        with:
          repository: seanchatmangpt/zcode-cli
          ref: f3a037a67c995b2e4bb2ec2e597aa7f87022cc05
          path: zcode-cli
          persist-credentials: false

      - name: Record exact subjects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cloud/receipts
          {
            echo "cloud=$(git -C cloud rev-parse HEAD)"
            echo "xaas=$(git -C xaas rev-parse HEAD)"
            echo "zcode=$(git -C zcode-cli rev-parse HEAD)"
          } | tee cloud/receipts/remote-relay-subjects.txt

      - name: Cross-repository contract court
        working-directory: cloud
        run: |
          python3 scripts/remote-relay-court.py \
            --local-contract contracts/xaas-remote-relay.contract.json \
            --xaas-contract ../xaas/priv/ultracode/remote-relay.contract.json \
            --zcode-contract ../zcode-cli/test/fixtures/gall-work.contract.json \
            --zcode-ocel-source ../zcode-cli/src/ocel-tap.ts \
            --receipt receipts/remote-relay-live-leg.json

      - name: Cloud envelope admission and replay court
        working-directory: cloud
        run: python3 -m unittest tests.test_xaas_relay

      - name: Setup XaaS BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.5.0.2"
          elixir-version: "1.20.2"

      - name: Native XaaS relay admission and replay court
        working-directory: xaas
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/xaas-remote-relay-court.exs <<'ELIXIR'
          Code.require_file(Path.expand("lib/xaas/ultracode/remote_relay.ex"))

          alias Xaas.Ultracode.RemoteRelay
          alias Xaas.Ultracode.RemoteRelay.Envelope

          descriptor = %{
            "schema" => "gall.work-lease/1",
            "work_order_iri" => "urn:gall:work:chatgpt-roundtrip",
            "checkpoint_iri" => "urn:gall:checkpoint:chatgpt-roundtrip",
            "graph_digest" => "sha256:" <> String.duplicate("a", 64),
            "repository_identity" => "seanchatmangpt/chatgpt-cloud-elixir",
            "base_sha" => String.duplicate("b", 40),
            "epoch_id" => "11111111-1111-4111-8111-111111111111",
            "worker_id" => "chatgpt-roundtrip",
            "worktree" => "/tmp/chatgpt-roundtrip"
          }

          envelope = %Envelope{
            command_id: "cmd-chatgpt-roundtrip-1",
            epoch_id: descriptor["epoch_id"],
            task_id: descriptor["work_order_iri"],
            sequence: 1,
            intent_digest: descriptor["graph_digest"],
            exact_subject: descriptor["repository_identity"] <> "@" <> descriptor["base_sha"],
            verb: :actuate,
            execution_manifest_digest: "manifest-chatgpt-roundtrip",
            authority_ref: "court-authority",
            channel: :control,
            issued_at: 1,
            expires_at: 10_000
          }

          state = RemoteRelay.new_state(execution_manifest_digest: "manifest-chatgpt-roundtrip")
          {:ok, admitted} = RemoteRelay.admit_gall_work(state, envelope, descriptor, 5)
          {:ok, bound} = RemoteRelay.bind_actuation_idempotency(envelope, %{})
          "cmd-chatgpt-roundtrip-1" = bound["idempotency_key"]
          {:ok, acknowledged} = RemoteRelay.acknowledge(admitted, envelope)
          {:replay, ^acknowledged} = RemoteRelay.admit_gall_work(acknowledged, envelope, descriptor, 5)
          IO.puts("XAAS_REMOTE_RELAY_ALIVE")
          ELIXIR
          elixir /tmp/xaas-remote-relay-court.exs

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install zcode dependencies
        working-directory: zcode-cli
        run: bun install --frozen-lockfile

      - name: Native zcode gall-work lifecycle court
        working-directory: zcode-cli
        run: bun test test/gall-work.test.ts test/runtime/gall-work-e2e.test.ts

      - name: Upload live-leg receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-relay-live-leg-receipt
          path: |
            cloud/receipts/remote-relay-live-leg.json
            cloud/receipts/remote-relay-subjects.txt
          if-no-files-found: warn
