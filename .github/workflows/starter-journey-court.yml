name: Starter Journey Chicago

on:
  pull_request:
    paths:
      - "scripts/starter_journey_chicago.sh"
      - "scripts/chicago/**"
      - ".github/workflows/starter-journey-court.yml"
      - "manufacturing/**"
      - "versions.toml"

permissions:
  contents: read

jobs:
  chicago:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SUBJECT_REPOSITORY: ${{ github.repository }}
      SUBJECT_REF: ${{ github.head_ref }}
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact admitted subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact admitted subject
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
      - name: Execute real stranger journey
        shell: bash
        run: bash scripts/starter_journey_chicago.sh
      - name: Preserve Chicago receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: starter-journey-chicago-receipt
          path: ${{ runner.temp }}/starter-journey-chicago/receipt.json
          if-no-files-found: error
          retention-days: 14
