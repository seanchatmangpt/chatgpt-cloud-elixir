name: Local Control CI

on:
  pull_request:
    paths:
      - "local-control/**"
      - "scripts/*local-control*"
      - "scripts/local_control*"
      - "tests/test_local_control*"
      - ".github/workflows/local-control-ci.yml"
  push:
    paths:
      - "local-control/**"
      - "scripts/*local-control*"
      - "scripts/local_control*"
      - "tests/test_local_control*"
      - ".github/workflows/local-control-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-court:
    name: Installer shell court
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Shell syntax court (bash -n)
        run: |
          bash -n scripts/install-local-control-macos.sh
          bash -n scripts/uninstall-local-control-macos.sh
          bash -n scripts/install-local-control-macos-user.sh
          bash -n scripts/uninstall-local-control-macos-user.sh
      - name: Shellcheck court (blocking when shellcheck is present)
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            echo "::warning::shellcheck not available on this runner; court skipped (non-blocking)"
            exit 0
          fi
          shellcheck scripts/install-local-control-macos.sh \
            scripts/uninstall-local-control-macos.sh \
            scripts/install-local-control-macos-user.sh \
            scripts/uninstall-local-control-macos-user.sh

  python-court:
    name: Agent Python court (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile agent
        run: python -m py_compile scripts/local_control_agent.py
      - name: Python court (unittest discover)
        run: python -m unittest discover -s tests -p 'test_local_control*.py' -v
      - name: Validate example policy
        run: python scripts/local_control_agent.py validate-policy --policy local-control/policy.example.json
