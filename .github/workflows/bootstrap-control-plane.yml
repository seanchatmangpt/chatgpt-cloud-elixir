name: Bootstrap Control Plane

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/process-intelligence-capsule]
    paths:
      - .github/workflows/bootstrap-control-plane.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: "29.0"
          elixir-version: "1.20.2"
      - name: Install Phoenix generator
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix archive.install hex phx_new 1.8.9 --force
      - name: Generate source tree
        run: |
          rm -rf control-plane
          mix phx.new control-plane \
            --app chatgpt_cloud_control_plane \
            --module ChatGPTCloud \
            --database postgres \
            --no-install \
            --no-dashboard \
            --no-mailer \
            --no-gettext
      - name: Upload generated source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: chatgpt-cloud-control-plane-bootstrap
          path: control-plane
          if-no-files-found: error
          retention-days: 1
