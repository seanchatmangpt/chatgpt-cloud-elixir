schema_version = 1
name = "process-intelligence"
description = "Offline source-bound process-intelligence laboratory for AshR2RML and ex4pm."
fixture = "mix_smoke"
packages = []
required_modules = []
requires_services = []
acceptance = [
  "ash_r2rml: MIX_ENV=test mix compile --warnings-as-errors",
  "ash_r2rml: MIX_ENV=test mix test test/fortune5/",
  "ex4pm: MIX_ENV=test mix verify",
  "bridge: bash harness/verify.sh"
]

[runtime]
otp = "27.2.4"
elixir = "1.18.4"

[subjects.ash_r2rml]
repository = "https://github.com/seanchatmangpt/ash_r2rml.git"
sha = "ff1405ca59083a45321c05363673230dcf36c548"
tree_sha = "5bb8058d037f2e9689772144f769ac5ca80507ff"
build_acceptance = [
  "MIX_ENV=test mix compile --warnings-as-errors",
  "MIX_ENV=test mix test test/fortune5/"
]
consumer_acceptance = [
  "MIX_ENV=test mix compile --warnings-as-errors",
  "MIX_ENV=test mix test test/fortune5/"
]

[subjects.ex4pm]
repository = "https://github.com/seanchatmangpt/ex4pm.git"
sha = "542cef83cb8ce5aec6984c84c3234ca0f5ce2b2e"
tree_sha = "3ddcb90d49278444143f8af6be16d09603da9527"
build_acceptance = ["MIX_ENV=test mix verify"]
consumer_acceptance = ["MIX_ENV=test mix verify"]

[process_lab]
world = "harness/world.json"
ash_probe = "harness/ash_probe.exs"
ex4pm_probe = "harness/ex4pm_probe.exs"
verifier = "harness/verify.sh"
standing_scope = "offline_in_memory_process_intelligence"
external_crowns = ["postgresql", "ontop", "docker"]
